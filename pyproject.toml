[project]
name = "mini-redis"
version = "1.0.0"
description = "Redis-like key-value store with hand-rolled hash map, LRU & TTL in Python"
readme = "README.md"
requires-python = ">=3.8"
# 표준 라이브러리만 사용한다 (외부 의존성 없음).
dependencies = []

[tool.uv]
# 패키지로 설치하지 않고 저장소 루트에서 실행한다 (python -m ... / uv run python -m ...).
package = false
