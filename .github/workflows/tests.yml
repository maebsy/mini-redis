name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-22.04  # Python 3.8 빌드를 제공하는 러너
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      # setup-uv 가 matrix 의 Python 을 설치한다 (.python-version 보다 우선). 외부 의존성은 없다.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run python -m unittest discover -s tests -t . -v
      - name: Run example sessions
        run: for f in examples/*.txt; do uv run python main.py < "$f" > /dev/null; done
